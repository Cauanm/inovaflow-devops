name: InovaFlow CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017/inovaflow_db
      GEMINI_API_KEY: test-key
      GEMINI_MODEL: gemini-3.6-flash

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permissao para Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar projeto
        run: ./mvnw -B -ntp clean compile

      - name: Executar testes
        run: ./mvnw -B -ntp test

      - name: Gerar pacote JAR
        run: ./mvnw -B -ntp package -DskipTests


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagem Docker
        run: |
          docker build \
            -t inovaflow-backend:${{ github.sha }} \
            .


  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Disparar deploy do Staging no Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          curl -fsS "$DEPLOY_HOOK"

      - name: Validar ambiente Staging
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          echo "Aguardando o deploy do Staging..."
          sleep 90

          for i in {1..30}; do
            RESPONSE=$(curl -fsS "$HEALTH_URL" || true)

            echo "$RESPONSE"

            if echo "$RESPONSE" | grep -q '"status":"UP"' &&
               echo "$RESPONSE" | grep -q '"database":"inovaflow_staging"'; then
              echo "Staging funcionando corretamente."
              exit 0
            fi

            echo "Tentativa $i/30. Aguardando..."
            sleep 10
          done

          echo "Staging nao ficou disponivel a tempo."
          exit 1


  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Disparar deploy de Producao no Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          curl -fsS "$DEPLOY_HOOK"

      - name: Validar ambiente de Producao
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          echo "Aguardando o deploy de Producao..."
          sleep 90

          for i in {1..30}; do
            RESPONSE=$(curl -fsS "$HEALTH_URL" || true)

            echo "$RESPONSE"

            if echo "$RESPONSE" | grep -q '"status":"UP"' &&
               echo "$RESPONSE" | grep -q '"database":"inovaflow_production"'; then
              echo "Producao funcionando corretamente."
              exit 0
            fi

            echo "Tentativa $i/30. Aguardando..."
            sleep 10
          done

          echo "Producao nao ficou disponivel a tempo."
          exit 1