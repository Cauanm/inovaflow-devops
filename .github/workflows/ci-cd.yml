name: InovaFlow CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017/inovaflow_db
      GEMINI_API_KEY: test-key
      GEMINI_MODEL: gemini-3.6-flash

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permissao para Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar projeto
        run: ./mvnw -B -ntp clean compile

      - name: Executar testes
        run: ./mvnw -B -ntp test

      - name: Gerar pacote JAR
        run: ./mvnw -B -ntp package -DskipTests


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagem Docker
        run: |
          docker build \
            -t inovaflow-backend:${{ github.sha }} \
            .